<div id="auth-modal-backdrop" class="auth-modal-backdrop" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="auth-modal-current-title">
  <div class="auth-modal-container">

    <!-- LOGIN MODAL VIEW -->
    <div id="auth-modal-login" class="auth-modal-view">
      <div class="glass-card auth-card auth-modal-card">
        <button type="button" class="auth-modal-close" aria-label="Close dialog" data-auth-close>
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="auth-brand-lockup">
          <a href="{{ url_for('main.home') }}" aria-label="CyberPort Scanner Home">
            <img src="{{ url_for('static', filename='images/cyberport-symbol.svg') }}" alt="CyberPort Scanner Logo" class="auth-brand-symbol" width="48" height="48">
          </a>
        </div>
        <div class="section-kicker">secure access</div>
        <h2 id="auth-modal-current-title" class="auth-modal-title">Welcome back</h2>
        <p class="auth-modal-sub">Log in to access your scanner dashboard and scan history.</p>

        <div id="auth-modal-login-error" class="auth-modal-alert" style="display:none;" role="alert"></div>

        <form method="post" action="{{ url_for('main.login') }}" class="auth-form" id="modal-login-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label for="modal-login-email">Email address or username</label>
            <input class="form-input" type="text" id="modal-login-email" name="email" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="modal-login-password">Password</label>
            <input class="form-input" type="password" id="modal-login-password" name="password" autocomplete="current-password" maxlength="128" required>
          </div>
          <button class="btn btn-primary" type="submit" id="modal-login-submit">
            <i class="fa-solid fa-right-to-bracket"></i> Log In
          </button>
        </form>
        <div class="auth-footer">
          Don't have an account? <button type="button" class="auth-switch-btn" data-auth-switch="signup">Sign Up</button>
        </div>
      </div>
    </div>

    <!-- SIGNUP MODAL VIEW -->
    <div id="auth-modal-signup" class="auth-modal-view" style="display:none;">
      <div class="glass-card auth-card auth-modal-card">
        <button type="button" class="auth-modal-close" aria-label="Close dialog" data-auth-close>
          <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="auth-brand-lockup">
          <a href="{{ url_for('main.home') }}" aria-label="CyberPort Scanner Home">
            <img src="{{ url_for('static', filename='images/cyberport-symbol.svg') }}" alt="CyberPort Scanner Logo" class="auth-brand-symbol" width="48" height="48">
          </a>
        </div>
        <div class="section-kicker">get started</div>
        <h2 class="auth-modal-title">Create your account</h2>
        <p class="auth-modal-sub">Save your scans privately and access the dashboard securely.</p>

        <div id="auth-modal-signup-error" class="auth-modal-alert" style="display:none;" role="alert"></div>

        <form method="post" action="{{ url_for('main.signup') }}" class="auth-form" id="modal-signup-form">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="form-group">
            <label for="modal-signup-username">Username</label>
            <input class="form-input" type="text" id="modal-signup-username" name="username" autocomplete="username" minlength="3" maxlength="30" required>
          </div>
          <div class="form-group">
            <label for="modal-signup-email">Email address</label>
            <input class="form-input" type="email" id="modal-signup-email" name="email" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="modal-signup-password">Password</label>
            <input class="form-input" type="password" id="modal-signup-password" name="password" autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>
          <div class="form-group">
            <label for="modal-signup-confirm-password">Confirm password</label>
            <input class="form-input" type="password" id="modal-signup-confirm-password" name="confirm_password" autocomplete="new-password" minlength="8" maxlength="128" required>
          </div>
          <button class="btn btn-primary" type="submit" id="modal-signup-submit">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>
        <div class="auth-footer">
          Already have an account? <button type="button" class="auth-switch-btn" data-auth-switch="login">Login</button>
        </div>
      </div>
    </div>

  </div>
</div>
